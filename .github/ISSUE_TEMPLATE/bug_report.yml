name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real data: no customer mail, cluster exports,
        internal service names, credentials, or personal details. Paraphrase or
        use a synthetic example instead.

        For a security problem, do not open an issue. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, and what came out.
      placeholder: |
        $ <command>
        <output>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: macOS 15, Python 3.11.9
    validations:
      required: false
